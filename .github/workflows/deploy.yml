name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            shopsy-app/package-lock.json
            shopsy-api/package-lock.json

      - name: Install frontend deps
        run: |
          cd shopsy-app
          npm install

      - name: Build frontend
        run: |
          cd shopsy-app
          npm run build

      - name: Install backend deps
        run: |
          cd shopsy-api
          npm install

      - name: Build backend
        run: |
          cd shopsy-api
          npm run build
